databases:
  - name: acadza-review-db
    databaseName: acadza_review
    user: acadza_review
    plan: free

services:
  - type: web
    name: acadza-review
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: acadza-review-db
          property: connectionString
